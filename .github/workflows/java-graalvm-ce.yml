name: build java_graalvm-ce

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *" # bi-weekly on 1st and 15th calendar day at 17:00
  push:
    branches:
      - main
    paths:
      - java-graalvm-ce/**

permissions:
  actions: read
  packages: write

concurrency:
  group: java-graalvm-ce-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  build_and_push:
    name: "java${{ matrix.tag }}_graalvm-ce"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 17
          - 21
          - 25
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v7

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./java-graalvm-ce
          platforms: linux/amd64, linux/arm64
          file: ./java-graalvm-ce/${{ matrix.tag }}/Dockerfile
          push: true
          tags: ghcr.io/lovinoes/images:java${{ matrix.tag }}_graalvm-ce
